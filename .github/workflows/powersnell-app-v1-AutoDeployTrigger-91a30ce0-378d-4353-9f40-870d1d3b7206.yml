name: Trigger auto deployment for powersnell-app-v1

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ my-fix ]
    paths:
    - '**'
    - '.github/workflows/powersnell-app-v1-AutoDeployTrigger-91a30ce0-378d-4353-9f40-870d1d3b7206.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POWERSNELLAPPV1_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.POWERSNELLAPPV1_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.POWERSNELLAPPV1_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.POWERSNELLAPPV1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.POWERSNELLAPPV1_REGISTRY_PASSWORD }}
          containerAppName: powersnell-app-v1
          resourceGroup: openai-game
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


